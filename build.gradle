plugins { id 'net.fabricmc.fabric-loom' version '1.17.14' }
version = '1.3.0'
group = 'dev.lyn'
base { archivesName = 'SHOP-MOD-lyn' }
loom { accessWidenerPath = file('src/main/resources/shop-mod-lyn.accesswidener') }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    compileOnly files('libs/ECO-API-lyn-1.2.0.jar')
    runtimeOnly files('libs/ECO-API-lyn-1.2.0.jar')
    testImplementation files('libs/ECO-API-lyn-1.2.0.jar')
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }
jar { from('LICENSE') }
